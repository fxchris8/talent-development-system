version: "3.8"

volumes:
  backend_storage:
  mysql_data:

services:
  mysql:
    container_name: mysql-container
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tds
      MYSQL_USER: tds_user
      MYSQL_PASSWORD: tds_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - tds-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tds_backend:
    container_name: tds_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # OPENROUTER_* (LLM untuk generate materi/quiz) dibaca dari backend/.env; nilai di bawah menimpa isi file ini
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Database connection
      DB_HOST: mysql-container
      DB_PORT: 3306
      DB_USER: tds_user
      DB_PASS: tds_pass
      DB_NAME: tds

      # Application settings
      WEB_PORT: 8080
      ENV: development
      GIN_MODE: debug

      # Add other env vars as needed
      JWT_SECRET_KEY: your-secret-key
      SSO_BASE_URL: ${SSO_BASE_URL:-http://host.docker.internal:5000}
      SSO_FRONTEND_URL: ${SSO_FRONTEND_URL:-http://localhost:5173}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-client_29f1ebacc189d8f2162d95ea63acd6a5}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-http://localhost:8080/api/auth/sso/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: 4
      TTS_URL: http://tds_tts:5002
      # GROQ_API_KEY: your-groq-key
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage
      - ./backend/public:/app/public
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tds-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Suara materi training: mesin text-to-speech neural (Piper) berbahasa Indonesia, offline
  tds_tts:
    container_name: tds_tts
    build:
      context: ./tts
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - tds-net

  tds_frontend:
    container_name: tds_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_ENDPOINT: http://localhost:8080
      NEXT_PUBLIC_SSO_CLIENT_ID: ${SSO_CLIENT_ID:-client_29f1ebacc189d8f2162d95ea63acd6a5}
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
      JWT_SECRET: your-secret-key
    ports:
      - "3000:3000"
    volumes:
      # Bind mount source code for hot reload
      - ./frontend:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
      - /app/.next
    depends_on:
      tds_backend:
        condition: service_healthy
    networks:
      - tds-net

networks:
  tds-net:
    driver: bridge
